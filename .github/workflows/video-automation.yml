name: AOGx Autonomous Video Worker

on:
  # Hourly checks allow retries after provider reports temporary credit exhaustion.
  # 01:00 UTC corresponds to 08:00 Asia/Jakarta. GitHub may delay scheduled jobs.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aogx-autonomous-video-worker
  cancel-in-progress: false

jobs:
  run-daily-video-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install worker dependencies
        run: pip install "requests>=2.31,<3" "python-dotenv>=1.0,<2"
      - name: Run scheduled worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          AION_API_KEY: ${{ secrets.AION_API_KEY }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          XKIRO_MODEL: ${{ secrets.XKIRO_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
        run: python -m automation.worker
